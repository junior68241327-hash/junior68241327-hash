<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🐍 Snake Game</h1>

  <div class="info">
    <div>🏆 Score: <span id="score">0</span></div>
    <div>⭐ High Score: <span id="highScore">0</span></div>
    <div>🚀 Level: <span id="level">1</span></div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="buttons">
    <button id="restart">🔄 Restart</button>
    <button id="pause">⏸️ Pause</button>
  </div>

  <div id="gameOver" class="game-over">
    <div class="game-over-box">
      <h2>💀 GAME OVER</h2>
      <p>Your Score: <span id="finalScore">0</span></p>
      <button id="gameOverRestart">🔄 Play Again</button>
    </div>
  </div>

  <div class="controls">
    <button onclick="changeDirection('UP')">⬆️</button>

    <div>
      <button onclick="changeDirection('LEFT')">⬅️</button>
      <button onclick="changeDirection('DOWN')">⬇️</button>
      <button onclick="changeDirection('RIGHT')">➡️</button>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
